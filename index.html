<!-- The ?v= on style.css/script.js is the cache key for those files: a
     version bump makes them brand-new URLs, so no browser, proxy or
     service worker can hand back a stale copy. index.html itself can't
     be versioned this way (it's the URL you navigate to), so the
     service worker always fetches it from the network first - that's
     what delivers the new ?v= numbers. Run ./bump-version.sh to update
     every reference at once. -->
<link rel="stylesheet" href="style.css?v=36" />
</head>
